spring:
  application:
    name: pr-review-assistant-backend
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

dashboard:
  auth:
    issuer: ${DASHBOARD_AUTH_ISSUER:}
    audience: ${DASHBOARD_AUTH_AUDIENCE:}
    jwk-set-uri: ${DASHBOARD_AUTH_JWK_SET_URI:}
  github-connection:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    callback-url: ${GITHUB_OAUTH_CALLBACK_URL:}
    oauth-base-url: ${GITHUB_OAUTH_BASE_URL:https://github.com}
    state-ttl: ${GITHUB_OAUTH_STATE_TTL:10m}
    max-pages: ${GITHUB_OAUTH_MAX_PAGES:10}
    max-installations: ${GITHUB_OAUTH_MAX_INSTALLATIONS:1000}
    max-response-bytes: ${GITHUB_OAUTH_MAX_RESPONSE_BYTES:262144}

github:
  app:
    id: ${GITHUB_APP_ID}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    connect-timeout: 5s
    request-timeout: 20s
    token-refresh-skew: 5m
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}
    max-body-size: ${GITHUB_WEBHOOK_MAX_BODY_SIZE:1MB}

review:
  usage:
    monthly-limit: ${REVIEW_USAGE_MONTHLY_LIMIT:50}
  repository-config:
    max-size: ${REPOSITORY_CONFIG_MAX_SIZE:32KB}
  analysis:
    max-findings: ${REVIEW_AI_MAX_FINDINGS:5}
    minimum-candidate-confidence: ${REVIEW_AI_MINIMUM_CANDIDATE_CONFIDENCE:70}
  suppression:
    minimum-confidence: ${REVIEW_SUPPRESSION_MINIMUM_CONFIDENCE:85}
    minimum-severity: ${REVIEW_SUPPRESSION_MINIMUM_SEVERITY:MEDIUM}
    max-publishable-findings: ${REVIEW_SUPPRESSION_MAX_PUBLISHABLE_FINDINGS:3}
  publication:
    enabled: ${REVIEW_PUBLICATION_ENABLED:false}
    max-summary-chars: ${REVIEW_PUBLICATION_MAX_SUMMARY_CHARS:6000}
    max-comment-chars: ${REVIEW_PUBLICATION_MAX_COMMENT_CHARS:2000}
    max-payload-chars: ${REVIEW_PUBLICATION_MAX_PAYLOAD_CHARS:20000}
    reconciliation-max-pages: ${REVIEW_PUBLICATION_RECONCILIATION_MAX_PAGES:10}
    max-attempts: ${REVIEW_PUBLICATION_MAX_ATTEMPTS:3}
    retry-base-delay: ${REVIEW_PUBLICATION_RETRY_BASE_DELAY:10s}
    retry-max-delay: ${REVIEW_PUBLICATION_RETRY_MAX_DELAY:5m}
    poll-interval: ${REVIEW_PUBLICATION_POLL_INTERVAL:5s}
    batch-size: ${REVIEW_PUBLICATION_BATCH_SIZE:10}
    lease-duration: ${REVIEW_PUBLICATION_LEASE_DURATION:2m}
  ai:
    enabled: ${REVIEW_AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    max-input-chars: ${AI_MAX_INPUT_CHARS:120000}
    max-schema-size: ${AI_MAX_SCHEMA_BYTES:64KB}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-terra}
      reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:2048}
      timeout: ${OPENAI_TIMEOUT:60s}
      max-retries: ${OPENAI_MAX_RETRIES:1}
  context:
    enabled: ${REVIEW_CONTEXT_ENABLED:true}
    max-files: ${REVIEW_CONTEXT_MAX_FILES:12}
    max-file-size: ${REVIEW_CONTEXT_MAX_FILE_BYTES:128KB}
    max-total-size: ${REVIEW_CONTEXT_MAX_TOTAL_BYTES:512KB}
    max-changed-file-size: ${REVIEW_CONTEXT_MAX_CHANGED_FILE_BYTES:128KB}
    max-lines-per-file: ${REVIEW_CONTEXT_MAX_LINES_PER_FILE:200}
    max-candidates: ${REVIEW_CONTEXT_MAX_CANDIDATES:100}
    max-api-requests: ${REVIEW_CONTEXT_MAX_API_REQUESTS:20}
  pull-request-fetch:
    max-files: ${PR_FETCH_MAX_FILES:1000}
    max-patch-size-per-file: ${PR_FETCH_MAX_PATCH_BYTES_PER_FILE:256KB}
    max-total-patch-size: ${PR_FETCH_MAX_TOTAL_PATCH_BYTES:5MB}
    max-pages: ${PR_FETCH_MAX_PAGES:10}
    max-page-response-size: ${PR_FETCH_MAX_RESPONSE_BODY_SIZE:8MB}
  job:
    max-attempts: ${REVIEW_JOB_MAX_ATTEMPTS:3}
    retry-base-delay: ${REVIEW_JOB_RETRY_BASE_DELAY:10s}
    retry-max-delay: ${REVIEW_JOB_RETRY_MAX_DELAY:5m}
  worker:
    enabled: ${REVIEW_WORKER_ENABLED:false}
    poll-interval: ${REVIEW_WORKER_POLL_INTERVAL:5s}
    batch-size: ${REVIEW_WORKER_BATCH_SIZE:10}
    lease-duration: ${REVIEW_WORKER_LEASE_DURATION:2m}
