spring:
  application:
    name: pr-review-assistant-backend
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true

github:
  app:
    id: ${GITHUB_APP_ID}
    private-key-path: ${GITHUB_PRIVATE_KEY_PATH}
    api-base-url: ${GITHUB_API_BASE_URL:https://api.github.com}
    connect-timeout: 5s
    request-timeout: 20s
    token-refresh-skew: 5m
  webhook:
    secret: ${GITHUB_WEBHOOK_SECRET}
    max-body-size: ${GITHUB_WEBHOOK_MAX_BODY_SIZE:1MB}

review:
  job:
    max-attempts: ${REVIEW_JOB_MAX_ATTEMPTS:3}
    retry-base-delay: ${REVIEW_JOB_RETRY_BASE_DELAY:10s}
    retry-max-delay: ${REVIEW_JOB_RETRY_MAX_DELAY:5m}
  worker:
    enabled: ${REVIEW_WORKER_ENABLED:false}
    poll-interval: ${REVIEW_WORKER_POLL_INTERVAL:5s}
    batch-size: ${REVIEW_WORKER_BATCH_SIZE:10}
    lease-duration: ${REVIEW_WORKER_LEASE_DURATION:2m}
